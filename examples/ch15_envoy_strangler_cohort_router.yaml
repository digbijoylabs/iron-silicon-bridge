# Reference Blueprint: Envoy Strangler Routing
static_resources:
  listeners:

  - name: ingress_443
    address:
      socket_address: { address: 0.0.0.0, port_value: 443 }
    filter_chains:

    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type":
            type.googleapis.com/envoy.extensions.filters.\
network.http_connection_manager.v3.HttpConnectionManager
          route_config:
            name: strangler_route
            virtual_hosts:

            - name: api_gateway
              domains: ["*"]
              routes:

              - match: { prefix: "/api/v1/customers" }  #
                route:                                  #
                  cluster: modern_golang_microservice

              - match: { prefix: "/api/v1/accounts" }   #
                route:                                  #
                  cluster: legacy_zos_connect
